name: Pendientes por correo

on:
  schedule:
    - cron: "15 8 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pendientes-por-correo
  cancel-in-progress: false

jobs:
  enviar-pendientes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar lista de pendientes
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_pending.py
