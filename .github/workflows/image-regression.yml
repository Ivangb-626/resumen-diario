name: Image regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-regression
  cancel-in-progress: true

jobs:
  image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar soporte de formatos de imagen
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow pillow-avif-plugin

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      - name: Comprobar imágenes con noticias RSS reales
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: python scripts/check_images_live.py

      - name: Publicar galería para revisión visual
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: image-review-${{ github.run_number }}
          path: image-samples/
          if-no-files-found: ignore
          retention-days: 7
