name: Image regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-regression
  cancel-in-progress: false

jobs:
  image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar soporte de formatos de imagen
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow pillow-avif-plugin

      - name: Ejecutar diez rondas de pruebas unitarias
        run: |
          for iteration in $(seq 1 10); do
            echo "========== RONDA $iteration/10 =========="
            python -m unittest discover -s tests -v
          done

      - name: Comprobar imágenes con noticias RSS reales
        run: python scripts/check_images_live.py
